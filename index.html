<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form | The Origin of Craft</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fcfaf7; color: #333; padding: 40px 20px; }
        .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #d4a373; }
        h1 { text-align: center; color: #d4a373; margin-bottom: 5px; font-weight: 400; letter-spacing: 1px; }
        .subtitle { text-align: center; font-style: italic; color: #777; margin-bottom: 30px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #d4a373; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #bd9265; }
    </style>
</head>
<body>

<div class="container">
    <h1>The Origin of Craft</h1>
    <div class="subtitle">Handcrafted Origami Orders</div>
    
    <form action="/submit-order" method="POST">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">

        <label for="origamiType">Select Origami Model</label>
        <select id="origamiType" name="origamiType">
            <option value="Classic Crane Set">Classic Crane Set (Pack of 10)</option>
            <option value="Geometric Kusudama Ball">Geometric Kusudama Ball</option>
            <option value="Lotus Flower Display">Lotus Flower Display</option>
            <option value="Modular Dragon Sculpture">Modular Dragon Sculpture</option>
        </select>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required>

        <label for="notes">Special Requests / Paper Preferences</label>
        <textarea id="notes" name="notes" rows="4" placeholder="E.g., Specific color themes, metallic foil paper, etc."></textarea>

        <button type="submit">Place Origami Order</button>
    </form>
</div>

</body>
</html>
